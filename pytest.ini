[pytest]
# Every suite in the project. Each one runs on a fresh clone: tests that need
# a built index, a populated database, sentence-transformers or a Groq key skip
# themselves rather than failing, so `pytest` is always a meaningful command.
#
# To run the skipped integration tests:
#   pip install -r requirements.txt
#   python -m data.ingestion.load_seed
#   python -m data.indexing.build_index
testpaths =
    backend/tests
    backend/retrieval
    data/tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -q --strict-markers
