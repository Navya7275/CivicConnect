[pytest]
# Only collect from directories that hold real, offline test suites.
#
# This matters: the files named `backend/retrieval/test_*.py` were originally
# demo scripts whose code ran at import time, downloading a ~90MB embedding
# model and making live Groq API calls just by being collected. Issue #2 item
# B8 rewrote them as proper tests (PR #6); add that path here once PR #6 is
# merged and the suite is confirmed offline.
testpaths =
    backend/tests
    data/tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -q --strict-markers
