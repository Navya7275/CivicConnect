name: Automated Weekly Scheme Sync

on:
  schedule:
    # Runs every Sunday at 02:00 AM UTC (07:30 AM IST)
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual trigger anytime via GitHub Actions button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Weekly Synchronization Pipeline
        run: python -m data.ingestion.weekly_sync --run-now

      - name: Check for modified files and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add civicconnect.db data/indexing/artifacts/ data/ingestion/raw_data/
          git diff --staged --quiet || (git commit -m "chore(data): automated weekly scheme sync [skip ci]" && git push)
